[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honest-retry"
version = "0.2.3"
description = "Retry HTTP requests only when it is safe: never replay a POST that may already have been received."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abbas Bidhan" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.24"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Source = "https://github.com/abbashkyt-creator/honest-retry"
"Why it exists" = "https://github.com/abbashkyt-creator/engineering-notes/blob/main/01-never-bid-twice.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
